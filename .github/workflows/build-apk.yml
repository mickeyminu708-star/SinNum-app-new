name: Build SinNum Hybrid APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          # Agar aapka project subfolder me hai, toh yahan folder ka naam dein (jaise SinNum-app-new agar wahi name hai)
          # Lekin agar sab kuch ek level andar hai toh niche working-directory use karenge:

      - name: Build Debug APK
        working-directory: ./SinNum-app-new
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinNum-Hybrid-App
          path: SinNum-app-new/app/build/outputs/apk/debug/app-debug.apk
